name: Build bitSwap

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Bundle Magisk (to root the new ROM)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          URL=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/topjohnwu/Magisk/releases/latest \
                | grep -o '"browser_download_url": *"[^"]*\.apk"' | grep -v -i debug | head -1 | sed 's/.*"\(https[^"]*\)"/\1/')
          echo "Magisk: $URL"
          curl -fsSL "$URL" -o magisk.apk
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets/magisk
          unzip -o -j magisk.apk 'lib/arm64-v8a/*' -d app/src/main/jniLibs/arm64-v8a
          unzip -o -j magisk.apk 'assets/boot_patch.sh' 'assets/util_functions.sh' -d app/src/main/assets/magisk
          unzip -o -j magisk.apk 'assets/stub.apk' -d app/src/main/assets/magisk || echo "no stub.apk in this Magisk"
          basename "$URL" .apk > app/src/main/assets/magisk/VERSION
          ls -la app/src/main/jniLibs/arm64-v8a app/src/main/assets/magisk

      - name: Signing key (optional)
        env:
          KS: ${{ secrets.BITSWAP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/bitswap.jks"
            echo "BITSWAP_KEYSTORE_PATH=$RUNNER_TEMP/bitswap.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          BITSWAP_KEYSTORE_PASSWORD: ${{ secrets.BITSWAP_KEYSTORE_PASSWORD }}
          BITSWAP_KEY_ALIAS: ${{ secrets.BITSWAP_KEY_ALIAS }}
          BITSWAP_KEY_PASSWORD: ${{ secrets.BITSWAP_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Name APK
        run: cp app/build/outputs/apk/release/app-release.apk "bitSwap-v0.1.${{ github.run_number }}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: bitSwap v0.1.${{ github.run_number }}
          files: bitSwap-v0.1.${{ github.run_number }}.apk
          make_latest: true
